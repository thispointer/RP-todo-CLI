# .github/workflows/ci-with-sbom.yml
name: CI with SBOM

on:
    push:
        branches: [trunk, develop]
    pull_request:
        branches: [trunk, develop]

# Global minimal permissions -- overwrite where needed
permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
              with:
                  enable-cache: true
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.12"
            - run: uv sync --dev
            - run: uv run ruff check --output-format=github .
            - run: uv run ruff format --check .
            - run: uv run pyright

    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            matrix:
                python-version: ["3.12", "3.13"]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
              with:
                  enable-cache: true
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ matrix.python-version }}
            - run: uv sync --dev
            - run: uv run pytest --cov --cov-branch --cov-report=xml --cov-report=term
            - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              if: matrix.python-version == '3.12'
              with:
                  files: ./coverage.xml
                  fail_ci_if_error: false
                  token: ${{ secrets.CODECOV_TOKEN }}

    build-and-sign:
        runs-on: ubuntu-latest
        needs: [lint, test]
        permissions:
            contents: write
            id-token: write
        outputs:
            hashes: ${{ steps.hash.outputs.hashes }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.12"
            - run: uv sync --dev

            - name: Build package
              run: uv build

            - name: Compute artifact hashes
              id: hash
              run: |
                  sha256sum dist/* | base64 -w0 > hashes.txt
                  echo "hashes=$(cat hashes.txt)" >> "$GITHUB_OUTPUT"

            - name: Generate SBOM (CycloneDX)
              run: |
                  uv export --no-hashes | uvx --from cyclonedx-bom cyclonedx-py requirements - > sbom.json

            - name: Run Trivy vulnerability scanner (SARIF)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: fs
                  scan-ref: .
                  format: sarif
                  output: trivy-results.sarif

            - name: Upload Trivy SARIF to GitHub Security
              uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
              with:
                  sarif_file: trivy-results.sarif

            - name: Run Trivy vulnerability scanner (table)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: fs
                  scan-ref: .
                  format: table
                  output: trivy-summary.txt

            - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

            - name: Sign wheel and SBOM
              run: |
                  cosign sign-blob --yes \
                    --bundle dist/cosign.bundle \
                    dist/*.whl

                  cosign sign-blob --yes \
                    --bundle sbom-cosign.bundle \
                    sbom.json

            - name: Upload signed artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: dist-signed
                  path: |
                      dist/
                      sbom.json
                      trivy-summary.txt
                      sbom-cosign.bundle

    provenance:
        needs: [build-and-sign]
        permissions:
            actions: read
            id-token: write
            contents: write
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
        with:
            base64-subjects: "${{ needs.build-and-sign.outputs.hashes }}"
            upload-assets: true
